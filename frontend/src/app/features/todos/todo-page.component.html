<div class="container stack">
  <header class="card header-brutal">
    <div class="header-content">
      <h1 class="title">LISTA DE TAREFAS</h1>
      <button
        class="toggle-theme"
        (click)="toggleTheme()"
        [attr.aria-label]="
          theme === 'light' ? 'Ativar modo escuro' : 'Ativar modo claro'
        "
      >
        <span class="icon">{{ theme === "light" ? "🌙" : "☀️" }}</span>
        <span class="label">{{ theme === "light" ? "Dark" : "Light" }}</span>
      </button>
    </div>
    <div class="subtitle">Angular • Design System Brutalista</div>
  </header>

  <!-- Entrada -->
  <section class="card">
    <div class="row wrap">
      <input
        class="input flex-grow"
        placeholder="Adicione uma tarefa..."
        [(ngModel)]="newTitle"
        (keyup.enter)="add()"
      />
      <button class="btn" (click)="add()">+ Add</button>
    </div>
  </section>

  <!-- Filtros -->
  <section class="card">
    <div class="row wrap gap">
      <input
        class="input flex-grow"
        placeholder="Buscar..."
        [(ngModel)]="query"
        (input)="apply()"
      />
      <select class="select" [(ngModel)]="filter" (change)="apply()">
        <option value="all">Todas</option>
        <option value="pending">Pendentes</option>
        <option value="done">Concluídas</option>
      </select>
      <select class="select" [(ngModel)]="sort" (change)="apply()">
        <option value="created">Criação</option>
        <option value="priority">Prioridade</option>
      </select>
      <button class="btn btn--danger" (click)="clearCompleted()">
        Limpar Concluídas
      </button>
    </div>
  </section>

  <!-- Lista -->
  <section class="stack">
    <div
      class="card"
      cdkDropList
      [cdkDropListDisabled]="sort === 'created'"
      (cdkDropListDropped)="sort === 'created' ? null : drop($event)"
      *ngIf="todos().length; else empty"
    >
      <div class="stack">
        <div
          class="todo"
          *ngFor="let t of todos(); trackBy: trackById"
          cdkDrag
          (cdkDragStarted)="onDragStart(t)"
          (cdkDragEnded)="onDragEnd(t)"
          [class.todo--done]="t.done"
          [class.todo--dragging]="t.__dragging"
        >
          <div class="row">
            <div
              *ngIf="sort !== 'created'"
              class="drag-handle"
              cdkDragHandle
              title="Arrastar"
            >
              ☰
            </div>
            <input
              #chk
              class="checkbox"
              type="checkbox"
              [checked]="t.done"
              (change)="onToggle(t.id, chk.checked)"
            />
            <span
              class="todo__title"
              [class.todo__title--done]="t.done"
              (dblclick)="toggleEdit(t)"
            >
              {{ t.title }}
            </span>
          </div>

          <div class="todo__actions">
            <button class="btn btn--ghost" (click)="toggleEdit(t)">✏️</button>
            <button class="btn btn--danger" (click)="onRemove(t.id)">🗑</button>
          </div>
        </div>

        <!-- editor inline -->
        <div
          class="card edit-card"
          *ngFor="let t of todos(); trackBy: trackById"
          [hidden]="!t.__edit"
        >
          <div class="row wrap">
            <input class="input flex-grow" [(ngModel)]="t.title" />
            <button class="btn btn--success" (click)="onToggle(t.id, !t.done)">
              {{ t.done ? "Desfazer" : "Concluir" }}
            </button>
            <button class="btn" (click)="saveEdit(t)">Salvar</button>
          </div>
        </div>
      </div>
    </div>

    <ng-template #empty>
      <div class="empty">Sem tarefas por aqui… adicione a primeira! 🚀</div>
    </ng-template>
  </section>
</div>
